name: astrbot_plugin_qzone_kit
logo: ./logo.png
display_name: 空间小助手
short_desc: 删说说、改资料；她自己会换签名、会发空间（攒多了会挑重要的发，可带表情包）
desc: >-
  【需要的前置】
  1. QQ空间 astrbot_plugin_qzone　2. QQ资料管理 astrbot_plugin_qqprofile —— 两个必装并启用。
  3. 【强烈推荐】我会永远陪着你 astrbot_plugin_private_companion（适配插件市场 6.5.6 稳定版）
     https://github.com/menglimi/astrbot_plugin_private_companion
     装了它，本插件才能读到她的睡眠/精力/情绪/关系/目标/日记/梦境这些真实状态，
     判断「该不该发说说、该换什么签名」会准得多；不装也能用，只是只能靠聊天记录猜。
  4. 可选：表情包管理器 meme_manager（给说说配图）。

  【功能】
  1. 删说说：按「第几条」或「哪一天（今天/昨天/前天/具体日期）」整批删。
  2. 改资料：昵称 / 签名 / 在线状态 / 头像。
  3. 立刻发一条「今天的总结」。
  4. 自己改签名（平时十几天一次，遇到大事可以一天左右一次；冷却没过就先记着，到点再换）。
  5. 自己发说说：心情、吐槽、不想当面说的话、心里话都行；有冷却，冷却里会攒着，
     攒得太多时会在发之前挑一遍 —— 重要的先发，太旧又不重要的就不发了（超过 3 条才挑，挑完发 3~5 条）。
     可以按概率给说说配一张表情包（来源：表情包管理器）；GIF 动图原样发，空间会保动画。
  6. 每天的总结和即时说说共用同一个配图概率，改一处两边一起变。
  7. 不跟每天那条总结撞车：给攒着的说说抽发布时间时，落进它前后 1.5 小时的窗口就重新抽，
     直到不撞为止；已经到点要发却正撞窗口的，就等这个窗口过去（最长约 3 小时）。
     总结几点发可以设置；不理它的话会自动跟着 QQ空间插件的 publish_cron 走，那边改了这边跟着变。
     每天总结如果那个时候电脑没开、机器人不在线，当天就不发了，也不补（补的话「今天」会在说昨天）。
  8. 数据边界：只按白名单「读」陪伴等插件的状态（不改不写，state_read_all_files 默认关）；
     daily_post_sync_qzone 默认开，会把每天总结的时间写回 QQ空间插件的 publish_cron，可关。
  9. 关机错过的：她自己的说说会在开机后 3 分钟 + 随机 2~60 分钟补发；
     碎片超过 5 天就不发了，要是全过期，那一次不发、按已发过处理，直接进下一轮冷却。
     补发时按现在的说法改口（昨天的内容说「昨晚」，不写「今天」）。

  【怎么用】
  装好两个前置后，把这句话发给你的 AI：

  「请帮我配置好 AstrBot 里的【空间小助手】插件，并验证是否可用。」

  AI 会按 SETUP-FOR-AI.md 配好参数、冷却、表情包，并验证发说说/改签名/删说说都能用。
